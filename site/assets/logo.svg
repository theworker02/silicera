<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Silicera">
  <title>Silicera</title>
  <desc>Silicon die with nested cache rings and a measured specialization path</desc>
  <defs>
    <linearGradient id="die" x1="18" y1="18" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f5f1"/>
      <stop offset="100%" stop-color="#e4e0d8"/>
    </linearGradient>
    <linearGradient id="core" x1="52" y1="52" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#243040"/>
      <stop offset="100%" stop-color="#141a22"/>
    </linearGradient>
  </defs>

  <!-- Package substrate -->
  <rect x="10" y="10" width="108" height="108" rx="10" fill="url(#die)" stroke="#1c2430" stroke-width="2.5"/>

  <!-- Bond-pad hints -->
  <g fill="#1c2430" opacity="0.28">
    <rect x="20" y="6" width="6" height="6" rx="1"/>
    <rect x="38" y="6" width="6" height="6" rx="1"/>
    <rect x="84" y="6" width="6" height="6" rx="1"/>
    <rect x="102" y="6" width="6" height="6" rx="1"/>
    <rect x="20" y="116" width="6" height="6" rx="1"/>
    <rect x="38" y="116" width="6" height="6" rx="1"/>
    <rect x="84" y="116" width="6" height="6" rx="1"/>
    <rect x="102" y="116" width="6" height="6" rx="1"/>
    <rect x="6" y="20" width="6" height="6" rx="1"/>
    <rect x="6" y="38" width="6" height="6" rx="1"/>
    <rect x="6" y="84" width="6" height="6" rx="1"/>
    <rect x="6" y="102" width="6" height="6" rx="1"/>
    <rect x="116" y="20" width="6" height="6" rx="1"/>
    <rect x="116" y="38" width="6" height="6" rx="1"/>
    <rect x="116" y="84" width="6" height="6" rx="1"/>
    <rect x="116" y="102" width="6" height="6" rx="1"/>
  </g>

  <!-- Dual-CCD divider -->
  <line x1="64" y1="22" x2="64" y2="106" stroke="#1c2430" stroke-width="1" opacity="0.12"/>

  <!-- L3 ring -->
  <rect x="24" y="24" width="80" height="80" rx="6" fill="none" stroke="#1c2430" stroke-width="1.75" opacity="0.28"/>
  <!-- L2 ring -->
  <rect x="36" y="36" width="56" height="56" rx="4" fill="none" stroke="#1c2430" stroke-width="1.75" opacity="0.48"/>
  <!-- L1 ring -->
  <rect x="46" y="46" width="36" height="36" rx="3" fill="none" stroke="#1c2430" stroke-width="1.75" opacity="0.72"/>

  <!-- Core tile grid -->
  <g>
    <rect x="52" y="52" width="10.5" height="10.5" rx="1.2" fill="url(#core)"/>
    <rect x="65.5" y="52" width="10.5" height="10.5" rx="1.2" fill="url(#core)"/>
    <rect x="52" y="65.5" width="10.5" height="10.5" rx="1.2" fill="url(#core)"/>
    <rect x="65.5" y="65.5" width="10.5" height="10.5" rx="1.2" fill="#1f6f78"/>
  </g>

  <!-- Inbound portable path -->
  <path d="M16 64 H46" fill="none" stroke="#1c2430" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="64" r="2.4" fill="#1c2430"/>

  <!-- Unselected candidate paths -->
  <path d="M82 54 L112 30" fill="none" stroke="#1c2430" stroke-width="2" opacity="0.22" stroke-linecap="round"/>
  <path d="M82 74 L112 98" fill="none" stroke="#1c2430" stroke-width="2" opacity="0.22" stroke-linecap="round"/>

  <!-- Measured selected path -->
  <path d="M82 64 H108" fill="none" stroke="#1f6f78" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M105 57.5 L114 64 L105 70.5 Z" fill="#1f6f78"/>
</svg>
