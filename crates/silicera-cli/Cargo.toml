[package]
name = "silicera-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "silicera — command-line interface for hardware-native specialization on AMD Zen"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/silicera-cli"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = [
    "src/**/*",
    "tests/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[[bin]]
name = "silicera"
path = "src/main.rs"

[dependencies]
silicera = { workspace = true }
silicera-runtime = { workspace = true }
silicera-lab = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
