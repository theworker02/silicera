[package]
name = "silicera"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Hardware-native program specialization for AMD Zen — core discovery, measurement, and HNEP"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/silicera"
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = [
    "src/**/*",
    "tests/**/*",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
raw-cpuid = { workspace = true }
parking_lot = { workspace = true }
indexmap = { workspace = true }
tracing = { workspace = true }
once_cell = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[features]
default = []
# Experimental TPM binding stub (does not affect specialization).
tpm = []
# Optional HW-counter probe surface (still Unavailable without privileges).
counters = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
