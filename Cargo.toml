[workspace]
resolver = "2"
members = [
    "crates/silicera",
    "crates/silicera-runtime",
    "crates/silicera-lab",
    "crates/silicera-cli",
    "tests",
]
exclude = [
    "benchmarks/arm_kernels",
    "fuzz",
]
default-members = [
    "crates/silicera",
    "crates/silicera-runtime",
    "crates/silicera-lab",
    "crates/silicera-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theworker02/silicera"
homepage = "https://theworker02.github.io/silicera/"
authors = ["Silicera Contributors"]
keywords = ["amd", "specialization", "autotuning", "zen", "performance"]
categories = ["hardware-support", "development-tools", "science"]

[workspace.dependencies]
silicera = { path = "crates/silicera", version = "0.2.0" }
silicera-runtime = { path = "crates/silicera-runtime", version = "0.2.0" }
silicera-lab = { path = "crates/silicera-lab", version = "0.2.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
raw-cpuid = "11"
parking_lot = "0.12"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossterm = "0.28"
ratatui = "0.29"
proptest = "1"
tempfile = "3"
once_cell = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1
